program: train_adaptation_wandb_sweep.py
method: grid
metric:
  name: metrics/test_acc
  goal: maximize
parameters:
  GPU_num:
    value: "0"
  seed:
    value: 42

  backbone:
    value: "resnet50"
  CLIP_backbone:
    value: "ViT-B/16"

  params:
    value: ["q", "k", "v"]
  position:
    value: "all"
  encoder:
    value: "both"
  r:
    value: 2
  scaling:
    value: 4.0
  dropout_rate:
    value: 0.0
  
  dataset:
    value: "Officehome"
  source:
    value: "Art"
  target:
    value: "Clipart"
