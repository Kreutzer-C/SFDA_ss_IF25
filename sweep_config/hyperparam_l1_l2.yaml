    value: 5.0
  lamb2:
    values: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0]
  alpha_decay:
    value: 0.5
  K:
    value: 10
  temperature:
    value: 0.07
  dynamic_ad:
    value: true